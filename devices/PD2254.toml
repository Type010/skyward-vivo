# Skyward-vivo device configuration for the vivo SM8550 platform.
# Platform: SM8550 / kalama, 1440x3200, A/B + dynamic partitions.

[device]
codename = "PD2254"
brand = "vivo"
model = "iQOO 11 Pro"
release_name = "IQOO 11 Pro(PD2254)"
ab = true
soc = { hans = "第二代骁龙®8移动平台", hant = "Snapdragon® 8 Gen 2 行動平台", en = "Snapdragon® 8 Gen 2 Mobile Platform" }
os_version_prop = "ro.vivo.build.version.incremental"

[firmware]
# The modem partition carries the WLAN firmware and board data.
partition = "modem"

[display]
width = 1440
height = 3200
density = 480

[modules]
# The vendor partition carries the complete module set with its
# modules.dep; vendor_dlkm's is a subset, so it comes after.
sources = ["vendor_boot", "vendor", "vendor_dlkm"]
# vivo touchscreen: vivo_ts over the stock input device (evdev).
load = ["vivo_ts"]

[haptics]
# Qualcomm's high-voltage haptics driver keeps the motor's resonant
# frequency here, in tenths of a hertz; it plays the click waveform it
# keeps as number 0, as the 13 Ultra's does.
click = 0
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.5, strongest = 1.0 }

[wlan]
# WCN7850 (kiwi_v2), the same driver the stock recovery loads.
modules = ["qca_cld3_kiwi_v2"]
writes = [{ path = "/sys/devices/platform/soc/b0000000.qcom,cnss-qca-converged/fs_ready", value = "1" }]
interface = "wlan0"
# The recovery's own supplicant, which the stock recovery runs, rather
# than the vendor's AIDL one, whose interface library the ramdisk lacks.
supplicant = "/system/bin/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

[backup]
# Baseband identity, the modem's golden copy, and the calibration vivo
# keeps for the sensors, the fingerprint reader and the WLAN MAC.
efs = ["modemst1", "modemst2", "fsg", "fsc", "persist"]
# Folders the phone's own secure world keeps in step with itself; an older
# copy written back would not open.
data_skipped = ["vendor/fingerprint", "vendor/faceunlock"]

[stock]
# The stock recovery this image is packed on. The package is named by its
# content; the recovery hash pins the partition taken out of it.
version = "PD2254_A_16.3.12.2.W10.V000L1"
package = "https://sysupdxdl.vivo.com.cn/upgrade/oem/files/20260908233622fc32910117df9c9c0f42686da3c6583d.zip"
recovery = "18a3f4175bdcfae0f0cf525e0908a51468008c3933066aabad79c0daf1861840"
